[package]
name = "mrubyedge-time"
version = "0.2.0"
edition = "2024"
authors = ["Uchio Kondo <udzura@udzura.jp>"]
description = "mruby-time provides Time class for mruby/edge"
license = "BSD-3-Clause"

[dependencies]
mrubyedge = { version = "2.0.0" }
libc = "0.2"

[dev-dependencies]
mrubyedge = { version = "2.0.0", features = ["default"] }
mruby-compiler2-sys = "0.5.0"

[features]
default = []
# Enable std::time based Time.__source (disabled on wasm by default)
std-time = []
