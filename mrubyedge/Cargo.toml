[package]
name = "mrubyedge"
version = "1.1.12"
edition = "2024"
authors = ["Uchio Kondo <udzura@udzura.jp>"]
description = "mruby/edge is yet another mruby that is specialized for running on WASM"
license = "BSD-3-Clause"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
fnv = { version = "1.0.7", optional = true }
plain = "0.2.3"
rand_core = { version = "0.10.0", optional = true }
rand_xorshift = { version = "0.5.0", optional = true }
regex = { version = "1.12.2", default-features = false, features = [
    "std",
], optional = true }
simple_endian = "0.3.3"

[dev-dependencies]
criterion = "0.5.1"
fnv = "1.0.7"
once_cell = "1.20.2"
# Temporary: mruby-compiler2 emits RITE0400 only after the vendored compiler in this
# branch; back to a crates.io version once mruby-compiler2-sys is released with it.
mruby-compiler2-sys = { git = "https://github.com/bash0C7/mruby-compiler2-sys", branch = "rite0400-vendor" }

[[bench]]
name = "benchmark"
harness = false

[[bench]]
name = "hashmap_comparison"
harness = false

[features]
default = ["wasi", "mrubyedge-debug"]
wasi = []
mruby-hash-fnv = ["dep:fnv"]
mruby-regexp = ["dep:regex"]
mrubyedge-debug = ["wasi"]
mruby-random = ["dep:rand_core", "dep:rand_xorshift"]
insn-limit = []
# mruby-securerandom = ["wasi", "dep:getrandom"]
no-wasi = []
