[package]
name = "mrubyedge-serde-json"
version = "0.2.0"
edition = "2024"
authors = ["Uchio Kondo <udzura@udzura.jp>"]
description = "mruby-serde-json provides JSON serialization/deserialization for mruby/edge using serde_json"
license = "BSD-3-Clause"

[dependencies]
mrubyedge = { version = "2.0.0" }
serde = ">= 1.0.228"
serde_json = ">= 1.0.149"

[dev-dependencies]
mrubyedge = { version = "2.0.0", features = ["default"] }
mruby-compiler2-sys = "0.5.0"
