[package]
name = "mrubyedge-math"
version = "0.2.0"
edition = "2024"
authors = ["Uchio Kondo <udzura@udzura.jp>"]
description = "mruby-math provides Math module for mruby/edge"
license = "BSD-3-Clause"

[dependencies]
mrubyedge = { version = "2.0.0" }

[dev-dependencies]
mrubyedge = { version = "2.0.0", features = ["default"] }
mruby-compiler2-sys = "0.5.0"
